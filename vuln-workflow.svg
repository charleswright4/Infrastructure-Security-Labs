<rect x="40" y="110" width="170" height="90" rx="10" fill="#e0ecff" stroke="#3b6ab5" stroke-width="1.5"/><text x="125.0" y="142.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Azure VM target</text><text x="125.0" y="160.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">Windows Server,</text><text x="125.0" y="178.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">intentionally unhardened</text><line x1="210" y1="155" x2="255" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="255" y="110" width="170" height="90" rx="10" fill="#fff4d6" stroke="#3b6ab5" stroke-width="1.5"/><text x="340.0" y="142.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Nessus scan</text><text x="340.0" y="160.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">Credentialed scan</text><text x="340.0" y="178.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">baseline findings</text><line x1="425" y1="155" x2="470" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="470" y="110" width="170" height="90" rx="10" fill="#fde2e2" stroke="#3b6ab5" stroke-width="1.5"/><text x="555.0" y="142.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Prioritize</text><text x="555.0" y="160.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">Rank by severity</text><text x="555.0" y="178.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">and ease of fix</text><line x1="640" y1="155" x2="685" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="685" y="110" width="170" height="90" rx="10" fill="#dcf5e3" stroke="#3b6ab5" stroke-width="1.5"/><text x="770.0" y="142.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Remediate</text><text x="770.0" y="160.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">PowerShell script</text><text x="770.0" y="178.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">reboot</text><line x1="855" y1="155" x2="900" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="900" y="110" width="170" height="90" rx="10" fill="#e8e0ff" stroke="#3b6ab5" stroke-width="1.5"/><text x="985.0" y="142.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Re-scan</text><text x="985.0" y="160.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">Same scan policy</text><text x="985.0" y="178.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#0f172a">compare before/after</text><path d="M 1000 205 C 1000 270, 125 270, 125 205" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="560" y="262" text-anchor="middle" font-size="12" fill="#475569">Maintenance mode: repeat on a schedule</text>
